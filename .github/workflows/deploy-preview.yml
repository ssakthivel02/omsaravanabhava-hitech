name: Deploy isolated Cloudflare preview

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact build/r2-10-sacred-visuals commit SHA approved for preview
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: omsaravanabhava-hitech-preview-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy preview only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify repository, branch and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ssakthivel02/omsaravanabhava-hitech"
          test "${GITHUB_REF_NAME}" = "build/r2-10-sacred-visuals"
          test "${GITHUB_SHA}" = "${{ inputs.expected_sha }}"
          echo "Exact preview candidate: ${GITHUB_SHA}"

      - name: Require approved sacred hero assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/images/home-murugan-valli-deivanai-1920.webp
          test -s public/images/home-murugan-valli-deivanai-mobile.webp

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact pnpm version
        run: test "$(pnpm --version)" = "10.4.1"

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Re-run release safety gates
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run scan:contamination

      - name: Build exact preview artifact
        env:
          DEPLOY_ENV: preview
        run: pnpm run build

      - name: Verify PWA assets before upload
        run: node scripts/check-pwa-installability.mjs

      - name: Verify sacred hero assets reached dist
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/images/home-murugan-valli-deivanai-1920.webp
          test -s dist/images/home-murugan-valli-deivanai-mobile.webp

      - name: Assert dist contains application assets only
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "dist/.wrangler"
            "dist/wrangler.toml"
            "dist/wrangler.preview.jsonc"
            "dist/PREVIEW_AUTHORITY.txt"
            "dist/INTEGRITY_MANIFEST_SHA256.txt"
          )
          for path in "${forbidden[@]}"; do
            if test -e "$path"; then
              echo "::error::Forbidden deployment metadata found in static asset root: $path"
              exit 1
            fi
          done

      - name: Assert preview configuration cannot bind production domain
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "omsaravanabhava-hitech-preview"' wrangler.preview.jsonc
          grep -q '"workers_dev": true' wrangler.preview.jsonc
          grep -q '"directory": "./dist"' wrangler.preview.jsonc
          if grep -Eiq 'omsaravanabhava\.org|custom_domain|routes?[[:space:]]*[:=]' wrangler.preview.jsonc; then
            echo "::error::Preview config contains a production/custom-domain binding"
            exit 1
          fi

      - name: Deploy only the isolated Workers Static Assets preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.129.0 deploy --config wrangler.preview.jsonc

      - name: Record immutable deployment identity
        if: success()
        run: |
          echo "### OmSaravanaBhava Hi-Tech R2.10 preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`omsaravanabhava-hitech-preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static asset root: \`./dist\` only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment marker: \`preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production/root-domain routing: unchanged by this workflow" >> "$GITHUB_STEP_SUMMARY"
