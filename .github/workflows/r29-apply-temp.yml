name: Apply integrated R2.8 R2.9 candidate

on:
  push:
    branches:
      - chatgpt/r29-integrated-candidate
    paths:
      - .github/workflows/r29-apply-temp.yml

permissions:
  contents: write

jobs:
  apply-integrated-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/r29-integrated-candidate
          fetch-depth: 0

      - name: Reassemble and verify integration bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .r29-stage/chunk-* > /tmp/r29-integrated-files.tar.gz.b64
          echo "b809f0b80e6b46b782bb93e609d0ef6b7bdcc8d5ff5c732db6ef8eaa649fbc51  /tmp/r29-integrated-files.tar.gz.b64" | sha256sum -c -
          base64 -d /tmp/r29-integrated-files.tar.gz.b64 > /tmp/r29-integrated-files.tar.gz
          echo "9941c22bd6e71617c5d54495b47fe348e52094f5765aedb81af6e9b99d1685bd  /tmp/r29-integrated-files.tar.gz" | sha256sum -c -

          cat > /tmp/r29-expected.txt <<'EOF'
          src/app/App.tsx
          src/app/Layout.tsx
          src/components/ConnectionStatus.tsx
          src/components/LanguageSwitch.tsx
          src/components/ReadAloud.tsx
          src/components/SaveControl.tsx
          src/components/StateBadge.tsx
          src/content/index.ts
          src/features/home/Home.tsx
          src/features/knowledge/Knowledge.tsx
          src/features/legal/Legal.tsx
          src/features/library/Library.tsx
          src/features/practice/Practice.tsx
          src/features/prayers/Prayers.tsx
          src/features/search/Search.tsx
          src/features/temples/ArupadaiVeedu.tsx
          src/features/temples/TempleDetail.tsx
          src/features/temples/Temples.tsx
          src/features/thiruppugazh/SongDetail.tsx
          src/features/thiruppugazh/Thiruppugazh.tsx
          src/features/trust/Completeness.tsx
          src/features/trust/NotFound.tsx
          src/features/trust/Sources.tsx
          src/features/works/Works.tsx
          src/lib/routeMeta.ts
          src/styles/r27.css
          src/styles/r28.css
          tests/content-integrity.test.ts
          tests/e2e/r28-locale.spec.ts
          tests/locale.test.tsx
          tests/r26.test.tsx
          EOF
          sed -i 's/^          //' /tmp/r29-expected.txt
          tar -tzf /tmp/r29-integrated-files.tar.gz | sort > /tmp/r29-archive.txt
          sort /tmp/r29-expected.txt > /tmp/r29-expected-sorted.txt
          diff -u /tmp/r29-expected-sorted.txt /tmp/r29-archive.txt
          test "$(wc -l < /tmp/r29-archive.txt | tr -d ' ')" -eq 31

      - name: Extract and enforce exact 31-file scope
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/r29-integrated-files.tar.gz
          git diff --name-only | sort > /tmp/r29-diff.txt
          diff -u /tmp/r29-expected-sorted.txt /tmp/r29-diff.txt
          test "$(wc -l < /tmp/r29-diff.txt | tr -d ' ')" -eq 31
          if grep -Eq '^(public/|source-data/|src/content/.*\.json$|wrangler\.preview\.jsonc$|\.github/workflows/(ci|deploy-preview)\.yml$|release/|docs/)' /tmp/r29-diff.txt; then
            echo "::error::Integrated candidate attempted a forbidden deployment, corpus, governance, or release-contract change"
            exit 1
          fi

      - name: Remove temporary transport files and commit candidate tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .r29-stage
          rm -f .github/workflows/r29-apply-temp.yml
          git add -A
          git status --short
          git commit -m "R2.9: integrate locale metadata, source freshness, search and lazy legal routes"
          git push origin HEAD:chatgpt/r29-integrated-candidate
