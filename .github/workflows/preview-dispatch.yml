name: Deploy exact R2.9 isolated preview

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved R2.9 SHA
        required: true
        default: 4c5df9d362a8498e5883e2357c9ef3f0f7abdb82
        type: string

permissions:
  contents: read

concurrency:
  group: omsaravanabhava-hitech-preview-deploy
  cancel-in-progress: false

env:
  AUTHORITATIVE_R2_9_SHA: 4c5df9d362a8498e5883e2357c9ef3f0f7abdb82

jobs:
  deploy-preview:
    name: Build and deploy exact R2.9 preview only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify requested SHA is the approved R2.9 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.expected_sha }}" = "${AUTHORITATIVE_R2_9_SHA}"

      - name: Checkout exact approved R2.9 commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Verify repository and checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ssakthivel02/omsaravanabhava-hitech"
          test "$(git rev-parse HEAD)" = "${AUTHORITATIVE_R2_9_SHA}"
          echo "Exact preview candidate: $(git rev-parse HEAD)"

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact pnpm version
        run: test "$(pnpm --version)" = "10.4.1"

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Re-run release safety gates
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run scan:contamination

      - name: Build exact preview artifact
        env:
          DEPLOY_ENV: preview
        run: pnpm run build

      - name: Verify PWA assets before upload
        run: node scripts/check-pwa-installability.mjs

      - name: Assert preview configuration cannot bind production domain
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "omsaravanabhava-hitech-preview"' wrangler.preview.jsonc
          grep -q '"workers_dev": true' wrangler.preview.jsonc
          grep -q '"directory": "./dist"' wrangler.preview.jsonc
          if grep -Eiq 'omsaravanabhava\.org|custom_domain|routes?[[:space:]]*[:=]' wrangler.preview.jsonc; then
            echo "::error::Preview config contains a production/custom-domain binding"
            exit 1
          fi

      - name: Deploy only isolated Workers Static Assets preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.129.0 deploy --config wrangler.preview.jsonc

      - name: Record immutable deployment identity
        if: success()
        run: |
          echo "### OmSaravanaBhava Hi-Tech R2.9 preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${AUTHORITATIVE_R2_9_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`omsaravanabhava-hitech-preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment marker: \`preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production/root-domain routing: unchanged" >> "$GITHUB_STEP_SUMMARY"
