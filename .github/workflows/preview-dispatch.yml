name: Deploy exact R2.9 isolated preview

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved R2.9 SHA
        required: true
        default: 4c5df9d362a8498e5883e2357c9ef3f0f7abdb82
        type: string

permissions:
  contents: read

concurrency:
  group: omsaravanabhava-hitech-preview-deploy
  cancel-in-progress: false

env:
  AUTHORITATIVE_R2_9_SHA: 4c5df9d362a8498e5883e2357c9ef3f0f7abdb82
  AUTHORITATIVE_R2_9_BRANCH: build/native-r6-flagship

jobs:
  deploy-preview:
    name: Build and deploy exact R2.9 preview only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify requested SHA is the approved R2.9 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.expected_sha }}" = "${AUTHORITATIVE_R2_9_SHA}"

      - name: Verify Cloudflare deployment credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Checkout authoritative R2.9 branch
        uses: actions/checkout@v7
        with:
          ref: build/native-r6-flagship
          fetch-depth: 1

      - name: Verify repository, branch head and exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ssakthivel02/omsaravanabhava-hitech"
          test "$(git rev-parse HEAD)" = "${AUTHORITATIVE_R2_9_SHA}"
          test "$(git rev-parse --abbrev-ref HEAD)" = "${AUTHORITATIVE_R2_9_BRANCH}"
          echo "Exact preview candidate: $(git rev-parse HEAD)"
          echo "Authoritative branch: $(git rev-parse --abbrev-ref HEAD)"

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact pnpm version
        run: test "$(pnpm --version)" = "10.4.1"

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Re-run release safety gates
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run scan:contamination

      - name: Build exact preview artifact from checked-out R2.9 identity
        shell: bash
        env:
          DEPLOY_ENV: preview
        run: |
          set -euo pipefail
          env -u GITHUB_SHA -u GITHUB_REF_NAME DEPLOY_ENV=preview pnpm run build

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('dist/release.json', 'utf8'));
          const expectedSha = process.env.AUTHORITATIVE_R2_9_SHA;
          const expectedBranch = process.env.AUTHORITATIVE_R2_9_BRANCH;
          if (release.commit !== expectedSha) {
            console.error(`release.json commit mismatch: ${release.commit} != ${expectedSha}`);
            process.exit(1);
          }
          if (release.branch !== expectedBranch) {
            console.error(`release.json branch mismatch: ${release.branch} != ${expectedBranch}`);
            process.exit(1);
          }
          if (release.environment !== 'preview') {
            console.error(`release.json environment mismatch: ${release.environment}`);
            process.exit(1);
          }
          console.log(`release.json exact identity PASS: ${release.commit} / ${release.branch} / ${release.environment}`);
          NODE

      - name: Verify PWA assets before upload
        run: node scripts/check-pwa-installability.mjs

      - name: Assert preview configuration cannot bind production domain
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "omsaravanabhava-hitech-preview"' wrangler.preview.jsonc
          grep -q '"workers_dev": true' wrangler.preview.jsonc
          grep -q '"directory": "./dist"' wrangler.preview.jsonc
          if grep -Eiq 'omsaravanabhava\.org|custom_domain|routes?[[:space:]]*[:=]' wrangler.preview.jsonc; then
            echo "::error::Preview config contains a production/custom-domain binding"
            exit 1
          fi

      - name: Deploy only isolated Workers Static Assets preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.129.0 deploy --config wrangler.preview.jsonc

      - name: Record immutable deployment identity
        if: success()
        run: |
          echo "### OmSaravanaBhava Hi-Tech R2.9 preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`${GITHUB_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${AUTHORITATIVE_R2_9_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${AUTHORITATIVE_R2_9_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`omsaravanabhava-hitech-preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment marker: \`preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production/root-domain routing: unchanged" >> "$GITHUB_STEP_SUMMARY"
